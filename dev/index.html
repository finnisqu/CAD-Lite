<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Lite v1.6 Architecture Harness</title>
  </head>
  <body>
    <main class="cad-lite-architecture-harness">
      <header class="cad-lite-architecture-harness__toolbar">
        <strong>CAD Lite v1.6 Architecture Harness</strong>
        <div class="cad-lite-architecture-harness__history">
          <button id="lc-undo" type="button">Undo</button>
          <button id="lc-redo" type="button">Redo</button>
          <span id="lc-save-status" aria-live="polite"></span>
        </div>
      </header>

      <div class="cad-lite-architecture-harness__columns">
        <aside>
          <section class="lc-card">
            <h2>Project</h2>
            <label><span>Project Name</span><input id="lc-project" type="text" /></label>
            <label><span>Date</span><input id="lc-date" type="date" /></label>
            <label><span>Notes</span><textarea id="lc-notes" rows="4"></textarea></label>
          </section>

          <section class="lc-card">
            <div class="cad-lite-architecture-harness__section-head">
              <h2>Layouts</h2>
              <button id="lc-add-layout" type="button">+ Add Layout</button>
            </div>
            <div id="lc-layouts"></div>
          </section>

          <section class="lc-card">
            <div class="cad-lite-architecture-harness__section-head">
              <h2>Areas / Pieces</h2>
              <button id="lc-add-area" class="lc-add-area-btn" type="button">+ Add Area</button>
            </div>
            <div id="lc-list"></div>
            <button id="lc-add" type="button">+ Add Piece</button>
            <div id="lc-pieces"></div>
          </section>
        </aside>

        <section class="cad-lite-architecture-harness__canvas">
          <h2>Piece geometry projection</h2>
          <div class="cad-lite-architecture-harness__workspace-bar">
            <button id="lc-workspace-design" type="button">DESIGN</button>
            <button id="lc-workspace-slab" type="button">SLAB</button>
            <button id="lc-add-slab" type="button">+ Blank Slab</button>
            <button id="lc-show-slab-material" type="button">Slab Material</button>
            <button id="lc-piece-snap" type="button">Object Snap</button>
            <button id="lc-grid-snap" type="button">Grid Snap</button>
            <button id="lc-tool-dimension" type="button">Dimension (D)</button>
            <button id="lc-tool-line" type="button">Line (L)</button>
            <button id="lc-tool-note" type="button">Note (N)</button>
            <button id="lc-show-grid" type="button">Grid</button>
            <button id="lc-show-dims" type="button">Piece Dims</button>
            <button id="lc-show-seams" type="button">Seams</button>
            <button id="lc-show-sink-centerlines" type="button">Sink CL</button>
            <button id="lc-show-cutout-labels" type="button">Cutout Labels</button>
            <button id="lc-show-manual-dims" type="button">Manual Dims</button>
            <button id="lc-show-notes" type="button">Notes</button>
            <button id="lc-show-lines" type="button">Lines</button>
            <label>
              <span>Number Format</span>
              <select id="lc-dim-format">
                <option value="fraction">Fraction</option>
                <option value="decimal">Decimal</option>
              </select>
            </label>
            <label>
              <span>Fraction Precision</span>
              <select id="lc-dim-precision">
                <option value="1">1</option>
                <option value="2">1/2</option>
                <option value="4">1/4</option>
                <option value="8">1/8</option>
                <option value="16">1/16</option>
              </select>
            </label>
            <span id="lc-canvas-meta" aria-live="polite"></span>
          </div>
          <div class="cad-lite-architecture-harness__canvas-wrap">
            <svg id="lc-svg" role="img" aria-label="Piece rendering architecture harness"></svg>
          </div>
          <p class="lc-small">
            Architecture harness: typed browser surfaces exercise the current v1.6
            command, view-preference, rendering, and persistence boundaries.
          </p>
          <pre id="build-info"></pre>
        </section>

        <aside class="lc-inspector-col">
          <section class="lc-card lc-inspector-panel">
            <h2>Inspector</h2>
            <div id="lc-inspector"></div>
          </section>
        </aside>
      </div>
    </main>

    <script type="module">
      import { getBuildInfo, mountCadLiteBrowserRuntime } from '/src/main.ts';

      const initialPayload = {

        },

              { id: 'area-kitchen', name: 'Kitchen' },

              },
              {

                slabPlacement: { x: 5.125, y: 54.75, rotation: 0 },

              { id: 'room-wall-demo', kind: 'wall', featureType: 'knee-wall', name: 'Knee Wall', x: 145, y: 92, length: 58, depth: 4, rotation: 12, visible: true, wallType: 'knee', wallHeight: 42 },

            slabCH: 100,
          },
          {
            id: 'layout-bath', name: 'Bath', quantity: 1, cw: 180, ch: 120, scale: 6, grid: 1,
            showGrid: true, pieceFillOpacity: 1, areas: [{ id: 'area-bath', name: 'Bath' }],
            activeAreaId: 'area-bath', pieces: [], dims: [], notes: [], lines: [], roomFeatures: [], plan: null, overlays: [],
          },
        ],
        ui: {
          workspace: 'layout', gridSnap: true, pieceSnap: true, slabCutClearance: 0.25,
          slabEdgeAllowance: 1.5, defaultSlabW: 126, defaultSlabH: 63,
          showSlabMaterial: true, showGrid: true, showDims: true, dimPrecision: 16, dimFormat: 'fraction',
        },
        active: 0,
      };

      document.querySelector('#build-info').textContent = JSON.stringify(getBuildInfo(), null, 2);
      window.cadLiteArchitectureRuntime = mountCadLiteBrowserRuntime({
        root: document,
        initialPayload,
        autosave: { key: 'cadlite:architecture-harness' },
      });
    </script>
  </body>
</html>
