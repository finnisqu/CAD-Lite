          doc.write_text("""# Batch 75 — Direct Manipulation Geometry Migration

## Scope

Batch 75 moves the next reusable numeric/constraint math out of annotation and room-feature interaction code and onto the geometry foundations established in Batches 64–72.

The batch is behavior-preserving. CAD-specific policies remain local: snap target selection, 6 px/8 px tolerances, the 2 px drag threshold, 3° weak straightening, 5° soft rotation snap, 90° cardinal increment, minimum sizes, modifiers, command construction, history, persistence, and saved project schema.

## Shared orthogonal constraint

`src/geometry/constraints.ts` now exposes `constrainPointToAxes()`, a pure helper that returns both the constrained point and whether the result is horizontal or vertical. Existing `constrainDrawPoint()` delegates to it while retaining its v1.5.99 near-zero behavior.

Annotation segment creation/editing and room-wall creation now share the same orthogonal constraint math instead of independently implementing Shift forcing and 3° weak straightening.

## Viewport numeric consumers

Annotation snapping/edit sessions and room-feature snapping/edit sessions now use the existing viewport helpers:

- `normalizeViewportScale()` for session scale normalization;
- `screenDistanceToWorld()` for screen-pixel tolerances and drag thresholds;
- `distanceBetween()` for pointer travel.

The screen-pixel policy values themselves remain application-owned.

## Room-feature rotation

Room-feature editing now uses the existing geometry angle helpers:

- `pointAngleDegrees()` for pointer angles;
- `snapAngleToIncrement()` for 90° forced and soft cardinal snapping.

The modifier policy remains unchanged: Shift forces the 90° snap; Alt bypasses the normal 5° soft snap.

## Architecture boundary

This batch does not move room-feature resize rules or annotation snap-target selection into geometry. Those behaviors encode application/domain policy rather than reusable numeric primitives.

## Regression coverage

`tests/geometry.test.ts` now locks forced, weak, configurable weak-angle, and legacy `constrainDrawPoint()` behavior. Existing annotation and room-feature interaction suites continue to validate the migrated consumers end-to-end.

## Next seam

Batch 76 should inspect persistence/history/compatibility boundaries now that the major geometry and interaction foundations are centralized. In particular, verify that transient interaction/preview state cannot leak into saved project payloads and that migration/round-trip tests cover the current v1.6 domain graph before broader bridge cleanup.
""")
          PY
