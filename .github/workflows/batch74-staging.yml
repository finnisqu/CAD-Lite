name: Batch 74 staging

on:
  push:
    branches:
      - batch74-staging-20261004

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[batch74-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@11.20.0
      - name: Apply Batch 74 migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          pieces_path = Path('src/app/interaction/pieces.ts')
          pieces = pieces_path.read_text()
          pieces_import_old = """import type { AppStore } from '../store';
          import type {
            InteractionState,
            ToolPointerInput,
          } from './types';
          """
          pieces_import_new = """import type { AppStore } from '../store';
          import {
            clearPointerInteraction,
            interactionWithPointer,
          } from './pointer-session';
          import type {
            InteractionState,
            ToolPointerInput,
          } from './types';
          """
          assert pieces_import_old in pieces
          pieces = pieces.replace(pieces_import_old, pieces_import_new, 1)

          pointer_state_old = """function pointerState(
            interaction: InteractionState,
            session: PiecePointerSession,
            input: ToolPointerInput,
            preview: PieceInteractionPreview | null,
          ): InteractionState {
            return {
              ...interaction,
              pointer: {
                pointerId: input.pointerId,
                startX: session.start.x,
                startY: session.start.y,
                x: input.x,
                y: input.y,
                buttons: input.buttons,
                modifiers: { ...input.modifiers },
              },
              preview: previewJson(preview),
            };
          }

          function clearPointerState(
            interaction: InteractionState,
          ): InteractionState {
            if (!interaction.pointer && interaction.preview === null) {
              return interaction;
            }

            return {
              ...interaction,
              pointer: null,
              preview: null,
            };
          }
          """
          pointer_state_new = """function pointerState(
            interaction: InteractionState,
            session: PiecePointerSession,
            input: ToolPointerInput,
            preview: PieceInteractionPreview | null,
          ): InteractionState {
            return interactionWithPointer(
              interaction,
              session.start,
              input,
              previewJson(preview),
            );
          }

          function clearPointerState(
            interaction: InteractionState,
          ): InteractionState {
            return clearPointerInteraction(interaction);
          }
          """
          assert pointer_state_old in pieces
          pieces = pieces.replace(pointer_state_old, pointer_state_new, 1)
          pieces_path.write_text(pieces)

          room_path = Path('src/app/interaction/room-features.ts')
          room = room_path.read_text()
          room_import_old = """import type { ReadonlyApplicationState } from '../state';
          import type { AppStore } from '../store';
          import type {
            ToolHandler,
          """
          room_import_new = """import type { ReadonlyApplicationState } from '../state';
          import type { AppStore } from '../store';
          import {
            clearPointerInteraction,
            interactionWithPointer,
          } from './pointer-session';
          import type {
            ToolHandler,
          """
          assert room_import_old in room
          room = room.replace(room_import_old, room_import_new, 1)

          room_lifecycle_old = """function clearInteraction(state: ReadonlyApplicationState) {
            return replaceInteractionState({
              ...state.session.interaction,
              pointer: null,
              preview: null,
            });
          }

          function pointerInteraction(
            state: ReadonlyApplicationState,
            session: EditSession,
            input: ToolPointerInput,
            preview: RoomFeatureEditPreview | null,
          ) {
            return replaceInteractionState({
              ...state.session.interaction,
              pointer: {
                pointerId: input.pointerId,
                startX: session.start.x,
                startY: session.start.y,
                x: input.x,
                y: input.y,
                buttons: input.buttons,
                modifiers: { ...input.modifiers },
              },
              preview: previewJson(preview),
            });
          }
          """
          room_lifecycle_new = """function clearInteraction(state: ReadonlyApplicationState) {
            return replaceInteractionState(
              clearPointerInteraction(state.session.interaction),
            );
          }

          function pointerInteraction(
            state: ReadonlyApplicationState,
            session: EditSession,
            input: ToolPointerInput,
            preview: RoomFeatureEditPreview | null,
          ) {
            return replaceInteractionState(
              interactionWithPointer(
                state.session.interaction,
                session.start,
                input,
                previewJson(preview),
              ),
            );
          }
          """
          assert room_lifecycle_old in room
          room = room.replace(room_lifecycle_old, room_lifecycle_new, 1)
          room_path.write_text(room)

          doc = Path('docs/architecture/BATCH_74_REMAINING_POINTER_LIFECYCLE_CONSUMERS.md')
          doc.write_text("""# Batch 74 — Remaining Pointer Lifecycle Consumers

## Scope

Batch 74 completes the consumer migration started in Batch 73. `PieceInteractionController` and `RoomFeatureInteractionController` now delegate their duplicated pointer snapshot and pointer/preview cleanup state transitions to the shared lifecycle primitives in `src/app/interaction/pointer-session.ts`.

The batch is intentionally narrow. It does not change selection policy, snapping, drag thresholds, preview formats, domain commands, history boundaries, persistence, or saved project schema.

## Piece interaction migration

`PieceInteractionController` keeps its existing local `pointerState()` and `clearPointerState()` adapters so the controller call sites remain stable, but those adapters no longer construct or clear interaction state themselves. They delegate to:

- `interactionWithPointer()` for pointer snapshots plus serialized preview state;
- `clearPointerInteraction()` for pointer/preview cleanup.

Piece-specific move/resize/rotate/blank behavior, selection drill-in, nudge transactions, DESIGN/SLAB policies, and commit labels remain application-owned.

## Room-feature interaction migration

`RoomFeatureInteractionController` keeps its small command-producing adapters, but their state transformations now delegate to the same shared lifecycle helpers. Room-feature move/resize/rotate previews, snapping, tool placement, commit labels, selection, and update commands remain room-feature-owned.

## Architecture reassessment

After migrating ToolController, annotation editing, pieces, and room features, there is no remaining source evidence for a controller hierarchy or generic interaction engine. The common lifecycle is now limited to small state transforms, and those transforms are centralized.

The controllers still differ materially in:

- session validity rules;
- preview models and serialization;
- click-vs-drag policy;
- selection semantics;
- domain command construction;
- transaction/history behavior;
- tool activation and cancellation semantics.

Those differences are healthy application-layer ownership and should not be abstracted merely for structural symmetry.

## Regression coverage

Batch 73's focused `pointer-session.test.ts` continues to lock the shared state-helper contract. Existing piece-interaction, piece-interaction-parity, piece-interaction-threshold, room-feature-interaction, annotation-editing, and tool-controller suites validate the migrated consumers end-to-end.

## Validation

The full architecture quality gate must pass: typecheck, lint, complete Vitest suite, production build, and browser-ready artifact verification.

## Next seam

With pointer lifecycle centralized, Batch 75 should move out of controller-lifecycle extraction. The next source-grounded pass should inspect the remaining direct-manipulation numeric/constraint duplication in annotation and room-feature interactions and either migrate it onto the geometry/numeric foundations already established in Batches 64–72 or explicitly leave domain-specific policy in place.
""")
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Batch 74
        run: npm run check
      - name: Commit staged migration
        shell: bash
        run: |
          git config user.name "Finnis Quick"
          git config user.email "100631962+finnisqu@users.noreply.github.com"
          git add src/app/interaction/pieces.ts src/app/interaction/room-features.ts docs/architecture/BATCH_74_REMAINING_POINTER_LIFECYCLE_CONSUMERS.md
          git commit -m "refactor: migrate remaining pointer lifecycle for Batch 74 [batch74-applied]"
          git push origin HEAD:batch74-staging-20261004
