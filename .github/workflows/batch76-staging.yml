name: Batch 76 staging

on:
  push:
    branches:
      - batch76-staging-20261004

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: batch76-staging-20261004

      - name: Apply patch
        run: python scripts/batch76_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm
        run: npm install --global npm@11.20.0

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, lint, test, and build
        run: npm run check

      - name: Commit validated staging files
        run: |
          git config user.name "Finnis Quick"
          git config user.email "100631962+finnisqu@users.noreply.github.com"
          git rm .github/workflows/batch76-staging.yml scripts/batch76_patch.py
          git add src/app/interaction/room-features.ts tests/room-feature-interactions.test.ts docs/architecture/BATCH_76_ROOM_FEATURE_DIRECT_MANIPULATION_GEOMETRY.md
          git commit -m "stage Batch 76 validated source"
          git push origin HEAD:batch76-staging-20261004
