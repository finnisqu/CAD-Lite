name: Architecture CI

on:
  push:
    branches:
      - architecture/v1.6-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm
        run: npm install --global npm@11.20.0

      - name: Install dependencies
        run: npm install

      - name: Typecheck, lint, test, and build
        run: npm run check

      - name: Verify browser-ready artifacts
        run: |
          test -f dist/cad-lite-v1.6.0.js
          test -f dist/cad-lite-v1.6.0.css
          ls -lh dist/

      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: architecture-package-lock
          path: package-lock.json
          retention-days: 1
