name: Architecture CI

on:
  push:
    branches:
      - architecture/v1.6-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm
        run: npm install --global npm@11.20.0

      - name: Install dependencies
        run: npm install

      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref_name == 'architecture/v1.6-foundation'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock architecture dependencies"
          git push

      - name: Typecheck, lint, test, and build
        run: npm run check

      - name: Verify browser-ready artifacts
        run: |
          test -f dist/cad-lite-v1.6.0.js
          test -f dist/cad-lite-v1.6.0.css
          ls -lh dist/
