name: Architecture CI

on:
  push:
    branches:
      - architecture/v1.6-foundation
      - smoke/v1.6.0-browser
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pin npm
        run: npm install --global npm@11.20.0

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, lint, test, and build
        run: npm run check:smoke

      - name: Verify browser-ready artifacts
        run: |
          test -f dist/cad-lite-v1.6.0.js
          test -f dist/cad-lite-v1.6.0.css
          test -f dist-smoke/index.html
          test -n "$(find dist-smoke/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find dist-smoke/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          echo "Library artifacts:"
          ls -lh dist/
          echo "Smoke-site artifacts:"
          find dist-smoke -maxdepth 2 -type f -print

      - name: Execute smoke site in headless Chrome
        run: |
          python3 -m http.server 4173 --directory dist-smoke >/tmp/cadlite-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 30s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --enable-logging=stderr \
            --v=0 \
            --dump-dom \
            http://127.0.0.1:4173/ \
            >/tmp/cadlite-dom.html \
            2>/tmp/cadlite-chrome.log || {
              status=$?
              echo "Headless Chrome failed or timed out with status $status"
              cat /tmp/cadlite-chrome.log || true
              exit "$status"
            }
          grep -q 'CAD Lite v1.6 Production Shell' /tmp/cadlite-dom.html
          grep -q 'data-cad-lite-production-shell' /tmp/cadlite-dom.html
