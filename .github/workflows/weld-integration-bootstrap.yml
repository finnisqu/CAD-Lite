name: Weld integration bootstrap

on:
  push:
    branches:
      - experiment/flatten-geometry-engine

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire weld persistence and browser runtime
        env:
          PATCH_SCRIPT_B64: 
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 --decode >/tmp/weld_patch.py
          python3 /tmp/weld_patch.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: wire Piece weld persistence and browser surfaces"
          git push origin HEAD:experiment/flatten-geometry-engine
